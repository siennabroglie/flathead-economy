name: Update LODES Historical Data

on:
  workflow_dispatch:
    inputs:
      rebuild_existing:
        description: "Intentionally rebuild existing annual LODES outputs (normally leave false)"
        required: true
        type: boolean
        default: false
  schedule:
    - cron: "37 13 1 * *"

permissions:
  contents: write

jobs:
  update-lodes-history:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download official LODES releases and build annual history
        run: |
          if [ "${{ inputs.rebuild_existing }}" = "true" ]; then
            python -m flathead_economic.lodes_history --config config/config.yaml --rebuild-existing
          else
            python -m flathead_economic.lodes_history --config config/config.yaml
          fi

      - name: Publish new annual outputs and source manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lodes/ metadata/lodes_history_manifest.json

          if git diff --cached --quiet; then
            echo "No new LODES outputs or manifest changes."
          else
            git commit -m "Add official LODES historical data"
            git push
          fi

      - name: Upload annual LODES data and manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flathead-lodes-history-${{ github.run_number }}
          if-no-files-found: warn
          path: |
            data/lodes/
            metadata/lodes_history_manifest.json
